services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
  ui:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    env_file: .env
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meeting_email
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
    volumes: [meeting_email_data:/var/lib/postgresql/data]
volumes:
  meeting_email_data:
